name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/playwright-browser/package-lock.json

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show toolchain versions
        run: moon version --all

      - name: Update package registry
        run: moon update

      - name: Rust native CLI
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo build --workspace
          cargo build --release -p proped-cli
          node scripts/test_version_consistency.mjs
          python3 scripts/test_native_package.py

      - name: Public disclosure check
        run: python3 scripts/check_public_disclosure.py

      - name: External harness unit tests
        run: python3 -m unittest scripts/test_external_harness.py

      - name: External manifest validation
        run: python3 scripts/external_harness.py validate

      - name: Utility batch unit tests
        run: python3 -m unittest scripts/test_utility_batch.py

      - name: Web driver protocol tests
        run: node scripts/test_web_driver_protocol.mjs

      - name: Utility batch report validation
        run: python3 scripts/utility_batch.py validate

      - name: Web driver protocol spike
        run: |
          python3 -m json.tool protocol/ui-driver-v1.schema.json > /dev/null
          python3 -m json.tool spikes/web-driver/react-spike.json > /dev/null
          node spikes/web-driver/parity.mjs

      - name: Prepare managed browser runtime for native CLI
        run: |
          npm ci --prefix web/playwright-browser --ignore-scripts
          npx --prefix web/playwright-browser playwright install --with-deps --only-shell chromium

      - name: Native CLI integration
        run: node scripts/test_native_cli.mjs

      - name: Release acceptance contract
        run: node scripts/release_gate.mjs

      - name: Format check
        run: moon fmt --check

      - name: Check
        run: moon check --target native

      - name: Test native
        run: moon test --target native

      - name: Test JavaScript
        run: moon test --target js

      - name: CLI smoke test
        run: bash scripts/ci_cli_smoke.sh

  web-generic:
    name: Web generic contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/react-component/package-lock.json
            web/vue-component/package-lock.json
            web/playwright-browser/package-lock.json
            web/next-ssr-hydration/package-lock.json
            web/nuxt-ssr-hydration/package-lock.json

      - name: Install Web project dependencies
        run: |
          npm ci --prefix web/react-component --ignore-scripts
          npm ci --prefix web/vue-component --ignore-scripts
          npm ci --prefix web/playwright-browser --ignore-scripts
          npm ci --prefix web/next-ssr-hydration --ignore-scripts
          npm ci --prefix web/nuxt-ssr-hydration --ignore-scripts
          npm audit --prefix web/nuxt-ssr-hydration --omit=dev
          npx --prefix web/playwright-browser playwright install --with-deps --only-shell chromium

      - name: Web project runner unit tests
        run: |
          python3 -m json.tool protocol/web-project-manifest.schema.json > /dev/null
          python3 -m json.tool protocol/web-project-manifest-v2.schema.json > /dev/null
          python3 -m json.tool web/project-manifests/proped-web-quality.json > /dev/null
          node scripts/test_sandbox_capability_model.mjs
          node scripts/test_web_execution_sandbox.mjs
          node scripts/test_web_project_manifest_v2.mjs
          node scripts/test_web_project_runner.mjs

      - name: Web project inspect unit tests
        run: node scripts/test_web_project_inspect.mjs

      - name: Generic browser adapter tests
        run: |
          node scripts/test_managed_browser_runtime.mjs
          node scripts/test_semantic_quiescence.mjs
          node web/playwright-browser/test-generic-browser-driver.mjs
          node scripts/test_indexeddb_inventory.mjs
          node scripts/test_dexie_inventory_adapter.mjs
          node scripts/test_web_volatility_miner.mjs
          node scripts/test_web_failure_classifier.mjs
          node scripts/test_web_replay_gate.mjs
          node scripts/test_web_server_hooks.mjs
          node scripts/test_web_command_server.mjs
          node scripts/test_web_server_hook_candidates.mjs
          node scripts/test_github_actions_workflow.mjs
          node scripts/test_web_selector_survival.mjs
          node scripts/test_web_state_novelty.mjs
          node scripts/test_web_coverage_guided_exploration.mjs
          node scripts/test_content_blind_opaque_web_replay.mjs
          node scripts/test_web_real_consumer_opaque_acceptance.mjs
          node scripts/test_web_exploration_stage_quality.mjs
          node scripts/test_web_multi_context_scheduler.mjs
          node scripts/test_web_semantic_property_candidates.mjs
          node scripts/test_web_semantic_projection_candidates.mjs
          node scripts/test_web_normalizer_candidates.mjs
          node scripts/test_web_semantic_review_report.mjs
          node scripts/test_web_semantic_approval.mjs
          node scripts/test_web_approved_semantics_runtime.mjs
          node scripts/test_web_semantic_apply.mjs
          node scripts/test_web_healthy_transition_benchmark.mjs
          node scripts/test_unknown_web_onboarding_acceptance.mjs
          node scripts/test_web_generic_property_packs.mjs
          node scripts/test_web_stateful_server_pack.mjs
          node scripts/test_web_project_onboarding_v2.mjs
          node scripts/test_web_project_benchmark.mjs
          node scripts/test_web_project_baseline.mjs
          node scripts/test_web_project_corpus.mjs
          node scripts/test_web_project_corpus_materialize.mjs
          node scripts/test_release_gate.mjs
          node scripts/test_web_project_workspace_prebuild.mjs
          node scripts/test_web_project_prepare.mjs
          node scripts/test_web_node_engine.mjs
          node scripts/test_web_node_runtime.mjs
          node scripts/test_web_package_manager_runtime.mjs
          node scripts/test_proped_web_cli.mjs

      - name: Controlled actionable-finding acceptance gate
        run: |
          node scripts/test_web_exploration_replay_gate.mjs
          node scripts/test_web_finding_incident.mjs
          node scripts/test_web_project_campaign.mjs

  web-quality:
    name: Web quality manifest
    runs-on: ubuntu-latest
    env:
      PROPED_COMPONENT_BENCHMARK_MAX_MS: 150000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/react-component/package-lock.json
            web/vue-component/package-lock.json
            web/playwright-browser/package-lock.json
            web/next-ssr-hydration/package-lock.json
            web/nuxt-ssr-hydration/package-lock.json

      - name: Install Web project dependencies
        run: |
          npm ci --prefix web/react-component --ignore-scripts
          npm ci --prefix web/vue-component --ignore-scripts
          npm ci --prefix web/playwright-browser --ignore-scripts
          npm ci --prefix web/next-ssr-hydration --ignore-scripts
          npm ci --prefix web/nuxt-ssr-hydration --ignore-scripts
          npm audit --prefix web/nuxt-ssr-hydration --omit=dev
          npx --prefix web/playwright-browser playwright install --with-deps --only-shell chromium

      - name: Validate Web project quality manifest
        run: node scripts/web_project_runner.mjs validate web/project-manifests/proped-web-quality.json

      - name: Run Web project quality manifest
        run: node scripts/web_project_runner.mjs run web/project-manifests/proped-web-quality.json --output protocol/out/web-project-runner

  production-baseline:
    name: Production onboarding baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/react-component/package-lock.json
            web/vue-component/package-lock.json
            web/playwright-browser/package-lock.json
            web/next-ssr-hydration/package-lock.json
            web/nuxt-ssr-hydration/package-lock.json

      - name: Install Web project dependencies
        run: |
          npm ci --prefix web/react-component --ignore-scripts
          npm ci --prefix web/vue-component --ignore-scripts
          npm ci --prefix web/playwright-browser --ignore-scripts
          npm ci --prefix web/next-ssr-hydration --ignore-scripts
          npm ci --prefix web/nuxt-ssr-hydration --ignore-scripts
          npx --prefix web/playwright-browser playwright install --with-deps --only-shell chromium

      - name: Install strict sandbox backend for production gate
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap

      - name: Production onboarding baseline gate
        run: |
          sudo env \
            "PATH=$PATH" \
            "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" \
            "$(command -v node)" scripts/web_project_benchmark.mjs \
              --corpus production \
              --baseline protocol/fixtures/production-campaign-baseline.json \
              --offline \
              --no-artifacts \
              --sandbox-mode strict

  test:
    name: test
    if: ${{ always() }}
    needs:
      - core
      - web-generic
      - web-quality
      - production-baseline
    runs-on: ubuntu-latest
    steps:
      - name: Verify required CI partitions
        env:
          CORE_RESULT: ${{ needs.core.result }}
          WEB_GENERIC_RESULT: ${{ needs.web-generic.result }}
          WEB_QUALITY_RESULT: ${{ needs.web-quality.result }}
          PRODUCTION_BASELINE_RESULT: ${{ needs.production-baseline.result }}
        run: |
          test "$CORE_RESULT" = success
          test "$WEB_GENERIC_RESULT" = success
          test "$WEB_QUALITY_RESULT" = success
          test "$PRODUCTION_BASELINE_RESULT" = success

  production-external-contracts:
    name: Production external contracts
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Node 20 frontier runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.0

      - name: Register Node 20 frontier runtime
        run: echo "PROPED_NODE_RUNTIME_PATHS=$(command -v node)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm frontier runtime
        uses: pnpm/action-setup@v6
        with:
          version: 10.29.3
          run_install: false

      - name: Set up Bun frontier runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Prepare managed browser runtime
        run: |
          npm ci --prefix web/playwright-browser --ignore-scripts
          npx --prefix web/playwright-browser playwright install --with-deps --only-shell chromium

      - name: Install strict sandbox backend
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap

      - name: Verify private strict worktree sandbox
        env:
          PROPED_REQUIRE_PRIVATE_OVERLAY: "1"
        run: node scripts/test_web_execution_sandbox.mjs --live

      - name: Materialize promoted frontier corpus
        run: |
          node scripts/web_project_corpus.mjs materialize promoted-production \
              --checkout-root .tmp/ci-promoted-production

      - name: Promoted frontier production regression gate
        run: |
          env \
            "PROPED_NODE_RUNTIME_PATHS=$PROPED_NODE_RUNTIME_PATHS" \
            "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" \
            "MOON_HOME=$HOME/.moon" \
            node scripts/web_project_benchmark.mjs \
              --corpus promoted-production \
              --baseline protocol/fixtures/promoted-production-baseline.json \
              --checkout-root .tmp/ci-promoted-production \
              --no-artifacts \
              --sandbox-mode strict

      - name: Materialize external production corpus
        run: |
          node scripts/web_project_corpus.mjs materialize external-production \
              --checkout-root .tmp/ci-external-production

      - name: External production regression gate
        run: |
          env \
            "PROPED_NODE_RUNTIME_PATHS=$PROPED_NODE_RUNTIME_PATHS" \
            "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" \
            "MOON_HOME=$HOME/.moon" \
            node scripts/web_project_benchmark.mjs \
              --corpus external-production \
              --checkout-root .tmp/ci-external-production \
              --no-artifacts \
              --sandbox-mode strict

  external-matrix:
    name: External contracts (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1-of-3
            targets: >-
              proton-demo-todo ensenzu-app signal-reader moonbit-editor-file-tree canopy-components
          - shard: 2-of-3
            targets: >-
              canopy-editor-integration rabbita-utility-batch incr-typed-spreadsheet circular-state isomorphic-suite
          - shard: 3-of-3
            targets: >-
              rabbita-xterm-lifecycle moonclaw-job mooncakes-official-ui selene-editor-assets openseek-desktop-lifecycle
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update package registry
        run: moon update

      - name: Validate manifests
        run: python3 scripts/external_harness.py validate

      - name: Run external shard
        run: bash scripts/ci_external_matrix_shard.sh ${{ matrix.targets }}

  managed-runtime-distribution:
    name: Managed runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            setup_args: --force-managed-node
          - os: macos-latest
            setup_args: ""
          - os: windows-latest
            setup_args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chromium system dependencies
        if: runner.os == 'Linux'
        run: |
          npm ci --prefix web/playwright-browser --ignore-scripts
          npx --prefix web/playwright-browser playwright install-deps chromium

      - name: Build native release shell
        run: cargo build --release -p proped-cli

      - name: Verify managed runtime distribution flow
        run: python scripts/test_managed_setup.py ${{ matrix.setup_args }}

  sandbox-policy:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux strict sandbox backend
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap

      - name: Verify external harness network denial on Linux
        if: runner.os == 'Linux'
        run: sudo python3 scripts/external_harness.py sandbox-check --cwd "$GITHUB_WORKSPACE"

      - name: Verify external harness network denial on macOS
        if: runner.os == 'macOS'
        run: python3 scripts/external_harness.py sandbox-check --cwd "$GITHUB_WORKSPACE"

      - name: Verify sandbox capability model
        run: node scripts/test_sandbox_capability_model.mjs

      - name: Verify Linux strict Web execution sandbox
        if: runner.os == 'Linux'
        run: sudo "$(command -v node)" scripts/test_web_execution_sandbox.mjs --live

      - name: Verify macOS constrained Web execution sandbox
        if: runner.os == 'macOS'
        run: node scripts/test_web_execution_sandbox.mjs --live