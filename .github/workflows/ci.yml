name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show toolchain versions
        run: moon version --all

      - name: Update package registry
        run: moon update

      - name: Format check
        run: moon fmt --check

      - name: Check
        run: moon check --target native

      - name: Test
        run: moon test --target native


      - name: CLI smoke test
        run: |
          moon run src/cli -- schema --json > /tmp/proped-rabbita-schema.json
          moon run src/cli -- demo run all --json > /tmp/proped-rabbita-run.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          schema = json.loads(Path('/tmp/proped-rabbita-schema.json').read_text())
          result = json.loads(Path('/tmp/proped-rabbita-run.json').read_text())
          assert schema['name'] == 'proped-rabbita'
          assert schema['demoIds'] == ['newsletter', 'rabbita-counter']
          assert result['ok'] is True
          assert [run['id'] for run in result['runs']] == ['newsletter', 'rabbita-counter']
          for run in result['runs']:
              assert run['failures'] == 0
              output = Path(run['output'])
              for artifact in run['artifacts']:
                  assert (output / artifact).is_file(), output / artifact
          PY
