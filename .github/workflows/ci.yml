  external-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - proton-demo-todo
          - ensenzu-app
          - signal-reader
          - moonbit-editor-file-tree
          - canopy-components
          - canopy-editor-integration
          - rabbita-utility-batch
          - incr-typed-spreadsheet
          - circular-state
          - isomorphic-suite
          - rabbita-xterm-lifecycle
          - moonclaw-job
          - mooncakes-official-ui
          - selene-editor-assets
          - openseek-desktop-lifecycle
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update package registry
        run: moon update

      - name: Validate manifests
        run: python3 scripts/external_harness.py validate

      - name: Run external target
        run: |
          moon run src/cli -- external run "${{ matrix.target }}" --output /tmp/proped-matrix --json > /tmp/external-run.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/external-run.json').read_text())
          assert result['ok'] is True
          assert result['command'] == 'external run'
          assert len(result['runs']) == 1
          run = result['runs'][0]
          assert run['id'] == '${{ matrix.target }}'
          assert run['expectationMet'] is True
          assert run['diagnostics'] == 0
          for artifact in run['artifacts']:
              assert (Path(run['output']) / artifact).is_file()
          PY

  managed-runtime-distribution:
    name: Managed runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            setup_args: --force-managed-node
          - os: macos-latest
            setup_args: ""
          - os: windows-latest
            setup_args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chromium system dependencies
        if: runner.os == 'Linux'
        run: |
          npm ci --prefix web/playwright-browser --ignore-scripts
          npx --prefix web/playwright-browser playwright install-deps chromium

      - name: Build native release shell
        run: cargo build --release -p proped-cli

      - name: Verify managed runtime distribution flow
        run: python scripts/test_managed_setup.py ${{ matrix.setup_args }}

  sandbox-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install network-deny backend
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap

      - name: Verify network denial
        run: sudo python3 scripts/external_harness.py sandbox-check --cwd "$GITHUB_WORKSPACE"

      - name: Verify Web strict execution sandbox
        run: sudo "$(command -v node)" scripts/test_web_execution_sandbox.mjs --live
