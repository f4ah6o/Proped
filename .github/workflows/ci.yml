name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show toolchain versions
        run: moon version --all

      - name: Update package registry
        run: moon update

      - name: Format sources
        run: moon fmt

      - name: Commit formatted sources
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- core.mbt core_wbtest.mbt atlas.mbt rabbita_adapter.mbt; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core.mbt core_wbtest.mbt atlas.mbt rabbita_adapter.mbt
          git commit -m "style: format review fixes"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Check
        run: moon check --target native

      - name: Test
        run: moon test --target native
