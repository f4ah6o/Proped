name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show toolchain versions
        run: moon version --all

      - name: Update package registry
        run: moon update

      - name: Format check
        run: moon fmt --check

      - name: Check
        run: moon check --target native

      - name: Test
        run: moon test --target native

      - name: CLI smoke test
        run: |
          moon run src/cli -- schema --json > /tmp/proped-rabbita-schema.json
          moon run src/cli -- demo run all --json > /tmp/proped-rabbita-run.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          schema = json.loads(Path('/tmp/proped-rabbita-schema.json').read_text())
          result = json.loads(Path('/tmp/proped-rabbita-run.json').read_text())
          assert schema['name'] == 'proped-rabbita'
          assert schema['version'] == '0.3.0'
          assert schema['demoIds'] == [
              'newsletter',
              'rabbita-counter',
              'rabbita-todo',
          ]
          assert result['ok'] is True
          runs = {run['id']: run for run in result['runs']}
          assert list(runs) == ['newsletter', 'rabbita-counter', 'rabbita-todo']
          assert runs['newsletter']['failures'] == 0
          assert runs['rabbita-counter']['failures'] == 0

          todo = runs['rabbita-todo']
          assert todo['expectedOutcome'] == 'failure'
          assert todo['expectationMet'] is True
          assert todo['expectedFailure'] == {
              'property': 'stored todo titles are not blank',
              'trace': ['TitleChanged(" ")', 'Add'],
          }
          assert todo['failures'] == 1
          assert todo['states'] >= 100
          assert todo['transitions'] >= 1000
          assert todo['firstFailure']['trace'] == ['TitleChanged(" ")', 'Add']
          assert todo['firstFailure']['actionIds'] == ['title:1: ', 'add']
          assert todo['firstFailure']['traceLength'] == 2

          for run in runs.values():
              assert run['expectationMet'] is True
              output = Path(run['output'])
              for artifact in run['artifacts']:
                  assert (output / artifact).is_file(), output / artifact
          PY
