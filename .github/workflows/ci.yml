name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show toolchain versions
        run: moon version --all

      - name: Update package registry
        run: moon update

      - name: Format check
        run: moon fmt --check

      - name: Check
        run: moon check --target native

      - name: Test
        run: moon test --target native

      - name: CLI smoke test
        run: |
          moon run src/cli -- schema --json > /tmp/proped-rabbita-schema.json
          moon run src/cli -- demo run all --json > /tmp/proped-rabbita-run.json
          moon run src/cli -- external inspect-source src/vendor/proton_todo/upstream/main.mbt.txt --json > /tmp/proped-rabbita-inspection.json
          moon run src/cli -- external run all --json > /tmp/proped-rabbita-external.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          schema = json.loads(Path('/tmp/proped-rabbita-schema.json').read_text())
          result = json.loads(Path('/tmp/proped-rabbita-run.json').read_text())
          inspection = json.loads(Path('/tmp/proped-rabbita-inspection.json').read_text())
          external = json.loads(Path('/tmp/proped-rabbita-external.json').read_text())
          expected_ids = [
              'newsletter',
              'rabbita-counter',
              'rabbita-todo',
              'rabbita-sokoban',
              'rabbita-subscriptions',
              'rabbita-websocket',
          ]
          assert schema['name'] == 'proped-rabbita'
          assert schema['version'] == '0.5.0'
          assert schema['demoIds'] == expected_ids
          assert schema['externalIds'] == ['proton-demo-todo']
          assert result['ok'] is True
          runs = {run['id']: run for run in result['runs']}
          assert list(runs) == expected_ids

          expected_failures = {
              'rabbita-todo': (
                  'stored todo titles are not blank',
                  ['TitleChanged(" ")', 'Add'],
              ),
              'rabbita-sokoban': (
                  'invalid timeline input preserves cursor',
                  ['Move(Up)', 'JumpTo("not-a-number")'],
              ),
              'rabbita-subscriptions': (
                  'paused ticker ignores queued tick',
                  ['ToggleTicker', 'Tick'],
              ),
              'rabbita-websocket': (
                  'closing client rejects repeated disconnect',
                  [
                      'ClientConnectRequested',
                      'ClientDisconnectRequested',
                      'ClientDisconnectRequested',
                  ],
              ),
          }

          for demo_id in ['newsletter', 'rabbita-counter']:
              assert runs[demo_id]['expectedOutcome'] == 'pass'
              assert runs[demo_id]['failures'] == 0

          for demo_id, (property_name, trace) in expected_failures.items():
              run = runs[demo_id]
              assert run['expectedOutcome'] == 'failure'
              assert run['expectationMet'] is True
              assert run['failures'] == 1
              assert run['expectedFailure'] == {
                  'property': property_name,
                  'trace': trace,
              }
              assert run['firstFailure']['property'] == property_name
              assert run['firstFailure']['trace'] == trace
              assert run['firstFailure']['traceLength'] == len(trace)

          assert runs['rabbita-sokoban']['states'] >= 200
          assert runs['rabbita-subscriptions']['states'] >= 500
          assert runs['rabbita-websocket']['transitions'] >= 4000

          for run in runs.values():
              assert run['expectationMet'] is True
              output = Path(run['output'])
              for artifact in run['artifacts']:
                  assert (output / artifact).is_file(), output / artifact

          assert inspection['ok'] is True
          assert inspection['strategy'] == 'subscription-model'
          assert inspection['detected']['model'] is True
          assert inspection['detected']['message'] is True
          assert inspection['detected']['update'] is True
          assert inspection['detected']['subscription'] is True

          assert external['ok'] is True
          assert external['command'] == 'external run'
          assert len(external['runs']) == 1
          proton = external['runs'][0]
          assert proton['id'] == 'proton-demo-todo'
          assert proton['expectationMet'] is True
          assert proton['diagnostics'] == 0
          assert proton['states'] == 320
          assert proton['firstFailure']['property'] == 'snapshot version never decreases'
          assert proton['firstFailure']['trace'] == [
              'SnapshotReceived(version=1)',
              'SnapshotReceived(version=0)',
          ]
          for artifact in proton['artifacts']:
              assert (Path(proton['output']) / artifact).is_file()

          import hashlib
          source = Path('src/vendor/proton_todo/upstream/main.mbt.txt').read_bytes()
          assert hashlib.sha256(source).hexdigest() == (
              '69787a7a175b323ba0c6e01ea2acfc8692379ed938217bcf00c7d3a8c1f79c8b'
          )
          PY
