name: Format review fixes

on:
  push:
    branches:
      - feat/moonbit-flow-canvas
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update package registry
        run: moon update

      - name: Format MoonBit sources
        run: moon fmt

      - name: Commit formatted sources
        shell: bash
        run: |
          if git diff --quiet -- flow.mbt flow_atlas.mbt flow_wbtest.mbt; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flow.mbt flow_atlas.mbt flow_wbtest.mbt
          git commit -m "style: format review fixes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
