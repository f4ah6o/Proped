name: Format review fixes

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update package registry
        run: moon update

      - name: Format MoonBit sources
        run: moon fmt

      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: formatted-review-fixes
          path: |
            flow.mbt
            flow_atlas.mbt
            flow_wbtest.mbt
          if-no-files-found: error
