name: OSS Campaign

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 0" # Monday 03:17 JST

permissions:
  contents: read
  actions: read

concurrency:
  group: oss-campaign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - corpus: external
            id: production
            label: Production OSS corpus
            artifact: oss-campaign-production
          - corpus: frontier
            id: frontier
            label: Frontier OSS corpus
            artifact: oss-campaign-frontier

    env:
      CHECKOUT_ROOT: ${{ runner.temp }}/proped-oss-${{ matrix.id }}
      OUTPUT_ROOT: ${{ github.workspace }}/.proped/oss-campaign/${{ matrix.id }}

    steps:
      - name: Checkout Proped
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable package-manager shims
        run: corepack enable

      - name: Install browser runtime
        run: |
          set -euo pipefail
          npm ci --prefix web/playwright-browser --ignore-scripts
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          npx --prefix web/playwright-browser playwright install --with-deps --only-shell chromium

      - name: Restore previous benchmark summary
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous_dir="$RUNNER_TEMP/previous-${{ matrix.id }}"
          mkdir -p "$previous_dir"

          artifact_id="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${{ matrix.artifact }}&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty'
          )"

          if [[ -z "$artifact_id" ]]; then
            echo "summary=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            -o "$previous_dir/artifact.zip"
          unzip -q "$previous_dir/artifact.zip" -d "$previous_dir/artifact"

          previous_summary="$(find "$previous_dir/artifact" -type f -name summary.json -print -quit)"
          echo "summary=$previous_summary" >> "$GITHUB_OUTPUT"

      - name: Materialize pinned OSS corpus
        run: |
          set -euo pipefail
          mkdir -p "$CHECKOUT_ROOT" "$OUTPUT_ROOT"
          node scripts/proped.mjs web corpus materialize "${{ matrix.corpus }}" \
            --checkout-root "$CHECKOUT_ROOT" \
            | tee "$OUTPUT_ROOT/materialization.json"

      - name: Run OSS benchmark
        id: benchmark
        run: |
          set -euo pipefail
          previous_args=()
          if [[ -n "${{ steps.previous.outputs.summary }}" ]]; then
            previous_args=(--previous "${{ steps.previous.outputs.summary }}")
          fi

          node scripts/proped.mjs web benchmark \
            --corpus "${{ matrix.corpus }}" \
            --checkout-root "$CHECKOUT_ROOT" \
            --output "$OUTPUT_ROOT" \
            --sandbox-mode strict \
            "${previous_args[@]}"

      - name: Publish KPI summary
        if: always()
        env:
          CAMPAIGN_ID: ${{ matrix.id }}
          CAMPAIGN_LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          if [[ ! -f "$OUTPUT_ROOT/summary.json" ]]; then
            {
              echo "## ${CAMPAIGN_LABEL}"
              echo
              echo "No benchmark summary was produced."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("node:fs");
          const path = require("node:path");

          const output = process.env.OUTPUT_ROOT;
          const summary = JSON.parse(fs.readFileSync(path.join(output, "summary.json"), "utf8"));
          const percent = (value) => typeof value === "number" ? `${(value * 100).toFixed(1)}%` : "n/a";
          const yesNo = (value) => value === true ? "yes" : value === false ? "no" : "n/a";
          const shortSha = (value) => typeof value === "string" ? value.slice(0, 12) : "n/a";
          const diff = summary.qualityGate?.diff ?? null;
          const frontier = summary.frontierScore ?? null;

          const metadata = {
            schemaVersion: 1,
            propedSha: process.env.GITHUB_SHA,
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
            corpus: summary.corpus,
            benchmarkSemanticHash: summary.semanticHash,
          };
          fs.writeFileSync(path.join(output, "run-metadata.json"), `${JSON.stringify(metadata, null, 2)}\n`);

          const lines = [
            `## ${process.env.CAMPAIGN_LABEL}`,
            "",
            `Proped: \`${shortSha(process.env.GITHUB_SHA)}\` · corpus: \`${summary.corpus?.id ?? process.env.CAMPAIGN_ID}\` · gate: **${summary.ok ? "pass" : "fail"}**`,
            "",
            "| KPI | Result |",
            "| --- | ---: |",
            `| Auto-onboarding | ${summary.autoOnboardedCount}/${summary.projectCount} (${percent(summary.autoOnboardingRate)}) |`,
            `| Intervention projects | ${summary.interventionProjectCount}/${summary.projectCount} |`,
            `| Deterministic replay | ${summary.deterministicReplayProjectCount}/${summary.replayObservedProjectCount} (${percent(summary.deterministicReplayRate)}) |`,
            `| Project-specific adapter LOC | ${summary.projectSpecificAdapterLoc} |`,
            `| States explored | ${summary.metrics?.states ?? 0} |`,
            `| Transitions explored | ${summary.metrics?.transitions ?? 0} |`,
            `| Actions explored | ${summary.metrics?.actions ?? 0} |`,
          ];

          if (frontier) {
            lines.push(
              `| Qualified frontier targets | ${frontier.viability?.qualified ?? 0}/${summary.projectCount} |`,
              `| Generic capability rate | ${percent(frontier.genericCapability?.rate)} |`,
              `| Promotion eligible | ${yesNo(frontier.promotionEligible)} |`,
            );
          }

          if (diff) {
            lines.push(
              "",
              "### Delta from previous campaign",
              "",
              `- Absorbed: ${diff.improved?.length ? diff.improved.map((id) => `\`${id}\``).join(", ") : "none"}`,
              `- Regressed: ${diff.regressed?.length ? diff.regressed.map((id) => `\`${id}\``).join(", ") : "none"}`,
              `- Added: ${diff.added?.length ? diff.added.map((id) => `\`${id}\``).join(", ") : "none"}`,
              `- Removed: ${diff.removed?.length ? diff.removed.map((id) => `\`${id}\``).join(", ") : "none"}`,
            );
          }

          lines.push(
            "",
            "### Targets",
            "",
            "| Target | Repository @ revision | Auto | Replay | Interventions | States | Transitions |",
            "| --- | --- | ---: | ---: | --- | ---: | ---: |",
          );

          for (const project of summary.projects ?? []) {
            const reasons = project.interventionReasonCodes?.length ? project.interventionReasonCodes.join(", ") : "—";
            lines.push(
              `| \`${project.corpusEntryId ?? project.id}\` | \`${project.repository ?? "n/a"}@${shortSha(project.revision)}\` | ${yesNo(project.autoOnboarded)} | ${yesNo(project.deterministicReplay)} | ${reasons} | ${project.metrics?.states ?? 0} | ${project.metrics?.transitions ?? 0} |`,
            );
          }

          console.log(lines.join("\n"));
          NODE

      - name: Upload campaign result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.OUTPUT_ROOT }}
          if-no-files-found: warn
          retention-days: 90
